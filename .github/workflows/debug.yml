name: Debug Server

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "--- Tracker Status ---"
            sudo systemctl status tracker || true
            echo "--- Tracker Logs ---"
            sudo journalctl -u tracker -n 50 --no-pager
            echo "--- Frontend Status ---"
            sudo systemctl status frontend || true
            echo "--- Frontend Logs ---"
            sudo journalctl -u frontend -n 50 --no-pager
            echo "--- Database Status ---"
            /home/ubuntu/polywhale/venv/bin/python -c "
import sqlite3
try:
    conn = sqlite3.connect('/home/ubuntu/polywhale/src/polywhale.db')
    cursor = conn.cursor()
    cursor.execute('SELECT count(*) FROM trades;')
    print('Trades count in src/polywhale.db:', cursor.fetchone()[0])
    cursor.execute('SELECT * FROM trades LIMIT 2;')
    print('Recent trades:', cursor.fetchall())
except Exception as e:
    print('Error accessing DB:', e)
" || true
