name: Deploy Updates

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/polywhale
            git pull origin main
            
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Update .env file
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > src/.env
            
            # Open port 8080 in Ubuntu's internal firewall
            sudo iptables -I INPUT 1 -m state --state NEW -p tcp --dport 8080 -j ACCEPT || true
            sudo netfilter-persistent save || true
            
            sudo cp infra/tracker.service /etc/systemd/system/
            sudo cp infra/frontend.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl restart tracker
            sudo systemctl restart frontend

            echo "--- DIAGNOSTICS ---"
            sudo systemctl status tracker || true
            sudo journalctl -u tracker -n 50 --no-pager
            sudo systemctl status frontend || true
            sudo journalctl -u frontend -n 50 --no-pager
            
            /home/ubuntu/polywhale/venv/bin/python -c "
import sqlite3
try:
    conn = sqlite3.connect('/home/ubuntu/polywhale/src/polywhale.db')
    cursor = conn.cursor()
    cursor.execute('SELECT count(*) FROM trades;')
    print('Trades count in src/polywhale.db:', cursor.fetchone()[0])
    cursor.execute('SELECT * FROM trades LIMIT 2;')
    print('Recent trades:', cursor.fetchall())
except Exception as e:
    print('Error accessing DB:', e)
" || true
